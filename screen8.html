<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness Tracker - Progress</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        h1 {
            font-size: 1.8rem;
            color: #2c5282;
            margin-bottom: 15px;
        }
        p {
            font-size: 1.1rem;
            color: #555;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        .progress-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .progress-bar {
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: #2c5282;
            border-radius: 5px;
            width: 60%;
            transition: width 0.5s;
        }
        .streak-count {
            font-size: 1.2rem;
            color: #2c5282;
            font-weight: bold;
            margin-top: 5px;
        }
        .stats {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }
        .stat {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        .stat:last-child {
            border-bottom: none;
        }
        .stat-label {
            color: #555;
            font-size: 0.9rem;
        }
        .stat-value {
            font-weight: bold;
            color: #2c5282;
            font-size: 1rem;
        }
        .button {
            background-color: #2c5282;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
            width: 100%;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #1a3a5e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Your Wellness Progress</h1>
        <p>Here's how you're doing compared to your goals</p>
        
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <div class="streak-count">21 days</div>
        </div>
        
        <div class="stats">
            <div class="stat">
                <span class="stat-label">Energy Level</span>
                <span class="stat-value">7.5/10</span>
            </div>
            <div class="stat">
                <span class="stat-label">Focus Level</span>
                <span class="stat-value">8.2/10</span>
            </div>
            <div class="stat">
                <span class="stat-label">Stress Level</span>
                <span class="stat-value">4.1/10</span>
            </div>
            <div class="stat">
                <span class="stat-label">Consistency</span>
                <span class="stat-value">85%</span>
            </div>
        </div>
        
        <button class="button" onclick="window.location.href='index.html'">Continue Tracking</button>
    </div>
</body>
</html>
