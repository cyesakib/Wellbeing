<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness Tracker - Daily Check-In</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        h1 {
            font-size: 1.8rem;
            color: #2c5282;
            margin-bottom: 15px;
        }
        p {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 20px;
        }
        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .slider {
            width: 100%;
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
        }
        .slider-progress {
            height: 100%;
            background-color: #2c5282;
            border-radius: 5px;
            width: 0%;
            transition: width 0.3s;
        }
        .slider-label {
            font-size: 0.9rem;
            color: #555;
            margin-top: 5px;
        }
        .activity-selector {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .activity-option {
            padding: 8px;
            background-color: #f0f7ff;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .activity-option:hover {
            background-color: #e0f0ff;
        }
        .button {
            background-color: #2c5282;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
            margin-top: 15px;
            width: 100%;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #1a3a5e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Daily Check-In</h1>
        <p>Rate your current wellness levels</p>
        
        <div class="slider-container">
            <div class="slider">
                <div class="slider-progress" style="width: 50%"></div>
            </div>
            <div class="slider-label">Energy Level</div>
        </div>
        
        <div class="slider-container">
            <div class="slider">
                <div class="slider-progress" style="width: 50%"></div>
            </div>
            <div class="slider-label">Mental Focus</div>
        </div>
        
        <div class="slider-container">
            <div class="slider">
                <div class="slider-progress" style="width: 50%"></div>
            </div>
            <div class="slider-label">Stress Level</div>
        </div>
        
        <div class="activity-selector">
            <div class="activity-option">Walking</div>
            <div class="activity-option">Yoga</div>
            <div class="activity-option">Meditation</div>
            <div class="activity-option">Sleep</div>
        </div>
        
        <button class="button" onclick="window.location.href='screen7.html'">Done</button>
    </div>
</body>
</html>
