<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Metrics</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div class="max-w-md mx-auto p-6">
    <h1 class="text-2xl font-bold text-center mb-4 text-indigo-700">Health Metrics</h1>
    <p class="text-center text-gray-600 mb-6">Track your progress</p>
    
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Daily Steps</label>
        <div class="mt-1">
          <input type="range" 
                 min="5000" 
                 max="20000" 
                 value="10000" 
                 class="w-full bg-gray-200 rounded-lg cursor-pointer"
                 id="steps-slider">
        </div>
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700">Water Intake</label>
        <div class="mt-1">
          <input type="range" 
                 min="500" 
                 max="3000" 
                 value="1500" 
                 class="w-full bg-gray-200 rounded-lg cursor-pointer"
                 id="water-slider">
        </div>
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700">Calories</label>
        <div class="mt-1">
          <input type="range" 
                 min="1200" 
                 max="2500" 
                 value="1800" 
                 class="w-full bg-gray-200 rounded-lg cursor-pointer"
                 id="calories-slider">
        </div>
      </div>
    </div>
    
    <button 
      type="button" 
      onclick="window.location.href='screen5.html'" 
      class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 transition mt-4"
    >
      Next: Mental Health
    </button>
  </div>
</body>
</html>
