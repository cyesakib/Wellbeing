<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mental Health</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div class="max-w-md mx-auto p-6">
    <h1 class="text-2xl font-bold text-center mb-4 text-indigo-700">Mental Health</h1>
    <p class="text-center text-gray-600 mb-6">Monitor your mental state</p>
    
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Stress Level</label>
        <div class="mt-1">
          <input type="range" 
                 min="1" 
                 max="10" 
                 value="4" 
                 class="w-full bg-gray-200 rounded-lg cursor-pointer"
                 id="stress-slider">
        </div>
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700">Focus Duration</label>
        <div class="mt-1">
          <input type="range" 
                 min="5" 
                 max="60" 
                 value="20" 
                 class="w-full bg-gray-200 rounded-lg cursor-pointer"
                 id="focus-duration-slider">
        </div>
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700">Mood Score</label>
        <div class="mt-1">
          <input type="range" 
                 min="1" 
                 max="10" 
                 value="7" 
                 class="w-full bg-gray-200 rounded-lg cursor-pointer"
                 id="mood-slider">
        </div>
      </div>
    </div>
    
    <button 
      type="button" 
      onclick="window.location.href='screen6.html'" 
      class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 transition mt-4"
    >
      Next: Nutrition
    </button>
  </div>
</body>
</html>
