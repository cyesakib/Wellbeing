<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness Tracker - Goal Selection</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .container {
            text-align: center;
            max-width: 400px;
        }
        h1 {
            font-size: 1.8rem;
            color: #2c5282;
            margin-bottom: 15px;
        }
        p {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 20px;
        }
        .card {
            background-color: white;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
        }
        .card h3 {
            color: #2c5282;
            margin-top: 0;
            font-size: 1.2rem;
        }
        .card p {
            color: #666;
            font-size: 0.9rem;
        }
        .button {
            background-color: #2c5282;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #1a3a5e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>What would you like to improve?</h1>
        <p>Select your primary goal to get started</p>
        
        <div class="card" onclick="selectGoal('focus')">
            <h3>Focus</h3>
            <p>Improve concentration and mental clarity</p>
        </div>
        
        <div class="card" onclick="selectGoal('energy')">
            <h3>Energy</h3>
            <p>Boost daily vitality and stamina</p>
        </div>
        
        <div class="card" onclick="selectGoal('appearance')">
            <h3>Appearance</h3>
            <p>Enhance your physical well-being</p>
        </div>
        
        <button class="button" onclick="window.location.href='screen3.html'">Continue</button>
    </div>

    <script>
        function selectGoal(goal) {
            // This would handle the selection in a real app
            console.log('Selected goal:', goal);
        }
    </script>
</body>
</html>
