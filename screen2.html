<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Goal Selection</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-4">
  <div class="max-w-md mx-auto">
    <h1 class="text-2xl font-bold text-indigo-800 mb-4">Select Your Goal</h1>
    <form class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Energy Level</label>
        <select class="mt-1 block w-full py-2 px-3 border border-gray-300 rounded-md focus:outline-none focus:ring-indigo-500">
          <option>High</option>
          <option>Medium</option>
          <option>Low</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Sleep Quality</label>
        <select class="mt-1 block w-full py-2 px-3 border border-gray-300 rounded-md focus:outline-none focus:ring-indigo-500">
          <option>Excellent</option>
          <option>Good</option>
          <option>Needs Improvement</option>
        </select>
      </div>
      <button class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700">
        Continue
      </button>
    </form>
  </div>
</body>
</html>
