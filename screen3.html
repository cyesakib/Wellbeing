<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Goal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div class="max-w-md mx-auto p-6">
    <h1 class="text-2xl font-bold text-center mb-4 text-indigo-700">Your Goal</h1>
    <p class="text-center text-gray-600 mb-6">Set your daily target</p>
    
   <div class="space-y-4">
  <!-- Sliders (unchanged) -->
  <div>
    <label class="block text-sm font-medium text-gray-700">Daily Steps</label>
    <div class="mt-1">
      <input type="range" min="5000" max="20000" value="10000" id="steps-slider">
    </div>
  </div>
  
  <!-- NEW: PROGRESS TRACKING -->
  <div class="bg-green-50 p-3 rounded-lg">
    <p class="text-sm text-green-700">📈 Your Progress: <strong>10,000 steps</strong> (12% above last week)</p>
  </div>
</div>
