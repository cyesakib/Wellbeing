<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Goal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div class="max-w-md mx-auto p-6">
    <h1 class="text-2xl font-bold text-center mb-4 text-indigo-700">Your Goal</h1>
    <p class="text-center text-gray-600 mb-6">Set your daily target</p>
    
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Energy Level</label>
        <div class="mt-1">
          <input type="range" 
                 min="1" 
                 max="10" 
                 value="5" 
                 class="w-full bg-gray-200 rounded-lg cursor-pointer"
                 id="energy-slider">
        </div>
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700">Sleep Duration</label>
        <div class="mt-1">
          <input type="range" 
                 min="4" 
                 max="10" 
                 value="7" 
                 class="w-full bg-gray-200 rounded-lg cursor-pointer"
                 id="sleep-slider">
        </div>
      </div>
      
      <div>
        <label class="block text-sm font-medium text-gray-700">Mental Focus</label>
        <div class="mt-1">
          <input type="range" 
                 min="1" 
                 max="10" 
                 value="6" 
                 class="w-full bg-gray-200 rounded-lg cursor-pointer"
                 id="focus-slider">
        </div>
      </div>
    </div>
    
    <button 
      type="button" 
      onclick="window.location.href='screen4.html'" 
      class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 transition mt-4"
    >
      Next: Health Metrics
    </button>
  </div>
</body>
</html>
